# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject Firebase API key into photoscavenger config
        working-directory: ./photoscavenger
        env:
          FIREBASE_API_KEY: ${{ vars.PHOTOSCAVENGER_FIREBASE_API_KEY }}
        run: |
          if [ -z "$FIREBASE_API_KEY" ]; then
            echo "Error: PHOTOSCAVENGER_FIREBASE_API_KEY repository variable is not set!"
            exit 1
          fi
          sed "s/{{FIREBASE_API_KEY}}/$FIREBASE_API_KEY/g" firebase-config.template.js > firebase-config.js
          if grep -q "{{FIREBASE_API_KEY}}" firebase-config.js; then
            echo "Error: API key placeholder was not replaced!"
            exit 1
          fi
      - name: Build couplegames
        working-directory: ./couplegames
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.PHOTOSCAVENGER_FIREBASE_API_KEY }}
        run: |
          npm ci
          npm run build
          cp dist/index.html index.html
          rm -rf assets
          cp -r dist/assets assets
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SWIFT_TURTLE_COM }}
          channelId: live
          projectId: swift-turtle-com
